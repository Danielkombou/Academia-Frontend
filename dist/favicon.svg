<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4ecff"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- ribbon tails -->
  <path d="M20 8 L27 26 L32 12 Z" fill="#aa3bff"/>
  <path d="M44 8 L37 26 L32 12 Z" fill="#7c2dff"/>
  <rect x="28" y="6" width="8" height="8" rx="2" fill="#7c2dff"/>

  <!-- certificate paper -->
  <rect x="13" y="8" width="38" height="48" rx="4" fill="url(#paper)" stroke="#aa3bff" stroke-width="2.5"/>
  <rect x="18" y="13" width="28" height="38" rx="2" fill="none" stroke="#d8c4ff" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- gold seal with check -->
  <circle cx="32" cy="35" r="10.5" fill="url(#seal)" stroke="#b45309" stroke-width="2"/>
  <circle cx="32" cy="35" r="7.5" fill="none" stroke="#fff3c4" stroke-width="1.2"/>
  <path d="M27.2 35.4 l3.4 3.4 6.6-7.4" fill="none" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>